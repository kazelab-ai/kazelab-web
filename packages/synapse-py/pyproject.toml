[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kazelab-synapse"
version = "3.1.0"
authors = [
  { name="Tú (KazeLAB)", email="founder@kazelab.xyz" },
]
description = "Official Python SDK for KazeLab SynapseFlow Autonomous Multi-Agent Platform"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]
